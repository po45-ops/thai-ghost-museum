<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>พิพิธภัณฑ์ผีไทย</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pridi:wght@500;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: Netflix-style browse. Sticky nav, a hero billboard with the featured ghost video, horizontal rows of portrait cards that flip human to ghost on hover, and a detail sheet with video or a human/ghost reveal slider. One committed dark look: a museum hall at night, lamp-amber brand, each ghost brings its own spirit colour. */
:root{
  --bg:#0c0a09;
  --bg2:#14110f;
  --card:#1c1814;
  --raise:#272019;
  --line:#322a24;
  --ink:#f4ece3;
  --muted:#a89c90;
  --lamp:#eab04a;
  --spirit:#b8f24a;
  --display:'Pridi','Noto Serif Thai',Georgia,serif;
  --body:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif;
  --gut:max(16px,env(safe-area-inset-left,0px));
  --gutr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{display:block}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.gut{padding-left:var(--gut);padding-right:var(--gutr)}
.inner{max-width:1320px;margin:0 auto}

/* ---------- nav ---------- */
.nav{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:30;transition:background .3s;background:linear-gradient(180deg,rgba(12,10,9,.92),rgba(12,10,9,0))}
.nav.solid{background:rgba(12,10,9,.96);box-shadow:0 1px 0 var(--line)}
.nav .inner{display:flex;align-items:center;gap:22px;height:60px}
.logo{font-family:var(--display);font-weight:700;font-size:21px;color:var(--lamp);letter-spacing:.01em;white-space:nowrap}
.menu{display:flex;gap:4px;min-width:0;overflow-x:auto;scrollbar-width:none;flex:1}
.menu::-webkit-scrollbar{display:none}
.menu button{padding:6px 12px;border-radius:999px;color:var(--muted);font-weight:500;font-size:14.5px;white-space:nowrap;transition:color .2s}
.menu button:hover{color:var(--ink)}
.menu button[aria-current="true"]{color:var(--ink);font-weight:700}
.search{display:flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:6px;padding:4px 8px;transition:border-color .2s,background .2s}
.search.open{border-color:var(--ink);background:rgba(0,0,0,.6)}
.search svg{flex:0 0 auto}
.search input{width:0;border:0;outline:0;background:none;color:var(--ink);font:inherit;font-size:14px;transition:width .25s}
.search.open input{width:min(180px,34vw)}
.search input::placeholder{color:var(--muted)}

/* ---------- hero ---------- */
.hero{position:relative;min-height:560px;height:min(86vh,800px);overflow:hidden;isolation:isolate;background:var(--bg)}.hero .scene{position:absolute;inset:0;z-index:-3;background:url(img/hero-bg.jpg) 100% 30%/max(125%,178vh) auto no-repeat;filter:brightness(1.15) saturate(1.1);animation:sceneDrift 40s ease-in-out infinite alternate}@keyframes sceneDrift{from{transform:scale(1.04) translateX(0)}to{transform:scale(1.1) translateX(-1.5%)}}.hero .shade{position:absolute;inset:0;z-index:-2;background:linear-gradient(90deg,rgba(5,7,12,.7) 0,rgba(5,7,12,.38) 30%,rgba(5,7,12,.06) 55%,rgba(5,7,12,.2) 100%)}.hero .ff{position:absolute;inset:0;z-index:-1;pointer-events:none}.hero .ff i{position:absolute;width:5px;height:5px;border-radius:50%;background:#e9ff8a;box-shadow:0 0 8px 3px rgba(214,255,90,.75),0 0 22px 6px rgba(180,255,60,.35);opacity:0;animation:ffFloat var(--d,9s) ease-in-out var(--dl,0s) infinite}@keyframes ffFloat{0%{opacity:0;transform:translate(0,0)}15%{opacity:.95}50%{opacity:.35;transform:translate(var(--x,20px),var(--y,-30px))}70%{opacity:.9}100%{opacity:0;transform:translate(calc(var(--x,20px)*1.6),calc(var(--y,-30px)*1.8))}}@media (prefers-reduced-motion:reduce){.hero .scene,.hero .ff i{animation:none}.hero .ff i{opacity:.7}}@media (max-width:900px){.hero .scene{background-size:cover;background-position:48% 20%}.hero .shade{background:linear-gradient(180deg,rgba(5,7,12,.15) 0,rgba(5,7,12,.35) 55%,rgba(5,7,12,.7) 100%)}}
.hero-bg{position:absolute;inset:-6%;z-index:-3;width:112%;height:112%;object-fit:cover;filter:blur(16px) brightness(.62) saturate(1.25);transition:opacity .6s}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(40% 65% at 75% 50%,color-mix(in srgb,var(--spirit) 16%,transparent),transparent 72%),linear-gradient(180deg,rgba(0,0,0,.5) 0,transparent 16%,transparent 74%,var(--bg) 100%);transition:background .6s}
.hero .inner{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:end;gap:24px;padding-top:76px;padding-bottom:clamp(36px,7vh,72px)}
.hero-copy{min-width:0;max-width:600px;display:flex;flex-direction:column;gap:14px;align-self:center}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.16em;color:var(--spirit);text-transform:uppercase}
.hero h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(46px,6.6vw,96px);line-height:1.05;text-wrap:balance;text-shadow:0 4px 30px rgba(0,0,0,.6)}
.hero h1 small{display:block;font-family:var(--body);font-weight:500;font-size:clamp(13px,1.3vw,17px);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:14px;color:var(--muted)}
.meta .chip{border:1px solid var(--line);border-radius:4px;padding:0 8px;font-size:12.5px;color:var(--ink);background:rgba(0,0,0,.35)}
.fear{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-weight:600;font-size:13px}
.fear i{display:flex;gap:3px}
.fear b{width:8px;height:8px;border-radius:50%;background:#4a413a}
.fear b.on{background:var(--spirit);box-shadow:0 0 8px var(--spirit)}
.hero p.tag{margin:0;font-size:clamp(15px,1.5vw,19px);line-height:1.55;max-width:46ch;text-shadow:0 2px 16px rgba(0,0,0,.7)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:9px;border-radius:6px;padding:10px 24px;font-weight:700;font-size:16px;transition:background .2s,transform .15s}
.btn:active{transform:scale(.97)}
.btn.play{background:var(--ink);color:#15110e}
.btn.play:hover{background:#d8cfc5}
.btn.info{background:rgba(110,100,92,.55);color:var(--ink);backdrop-filter:blur(6px)}
.btn.info:hover{background:rgba(110,100,92,.8)}
.btn svg{flex:0 0 auto}
.hero-media{position:relative;justify-self:center;height:100%;max-height:100%;aspect-ratio:9/16;max-width:100%;align-self:stretch;margin-top:4px}
.hero-media .frame{position:absolute;inset:0;border-radius:14px;overflow:hidden;box-shadow:0 20px 70px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.08),0 0 80px color-mix(in srgb,var(--spirit) 22%,transparent);background:#000}
.hero-media video,.hero-media .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-media .poster{transition:opacity .5s}
.hero-media .poster.hide{opacity:0}
.fan{position:absolute;top:10%;height:80%;aspect-ratio:2/3;pointer-events:none}
.fan img{width:100%;height:100%;object-fit:cover;border-radius:12px;filter:brightness(.62) saturate(1.05);box-shadow:0 18px 50px rgba(0,0,0,.6)}
.fan span{position:absolute;top:12px;padding:1px 9px;border-radius:4px;background:rgba(0,0,0,.62);font-size:11.5px;font-weight:700;color:#ddd2c6;letter-spacing:.04em}
.fan.l{left:-50%;transform:rotate(-5deg);transform-origin:50% 100%}.fan.l span{left:12px}
.fan.r{left:50%;transform:rotate(5deg);transform-origin:50% 100%}.fan.r span{right:12px;color:var(--spirit)}
.snd{position:absolute;right:12px;bottom:12px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.55);background:rgba(0,0,0,.5);display:grid;place-items:center;backdrop-filter:blur(4px);transition:background .2s}
.snd:hover{background:rgba(0,0,0,.8)}
.snd span{display:none}
.snd.off{width:auto;padding:0 14px 0 10px;border-radius:999px;display:flex;gap:6px;align-items:center;font-size:13.5px;font-weight:600;color:#fff;border-color:var(--spirit);box-shadow:0 0 0 0 color-mix(in srgb,var(--spirit) 60%,transparent);animation:sndPulse 2s ease-out infinite}
.snd.off span{display:inline}
@keyframes sndPulse{to{box-shadow:0 0 0 12px transparent}}
@media (prefers-reduced-motion:reduce){.snd.off{animation:none}}
.dots{position:absolute;left:0;right:0;bottom:12px;z-index:2}
.dots .inner{display:flex;gap:8px}
.dots button{width:26px;height:4px;border-radius:2px;background:rgba(255,255,255,.28);transition:background .2s,width .2s}
.dots button[aria-current="true"]{background:var(--ink);width:40px}

/* ---------- rows ---------- */
main{position:relative;z-index:2;margin-top:-34px;padding-bottom:30px}
.row{margin-top:clamp(8px,1.6vw,22px)}
.row h2{margin:0 0 2px;font-size:clamp(17px,1.8vw,22px);font-weight:700;display:flex;align-items:baseline;gap:12px}
.row h2 span{font-size:12.5px;color:var(--muted);font-weight:500}
.rail{position:relative}
.track{--lead:max(var(--gut),calc((100% - 1320px)/2 + var(--gut)));display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding-block:14px 20px;padding-left:var(--lead);padding-right:var(--gutr);scroll-padding-left:var(--lead);overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.track .card{flex:0 0 clamp(132px,14vw,232px);scroll-snap-align:start}
.arr{position:absolute;top:14px;bottom:18px;width:clamp(36px,4vw,56px);z-index:3;display:grid;place-items:center;background:rgba(12,10,9,.6);opacity:0;transition:opacity .2s;font-size:0}
.arr.l{left:0}.arr.r{right:0}
.rail:hover .arr:not(:disabled){opacity:1}
.arr:disabled{opacity:0;pointer-events:none}
.arr:hover{background:rgba(12,10,9,.85)}
@media (hover:none){.arr{display:none}}

.card{position:relative;display:block;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--card);text-align:left;transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s;--sp:var(--spirit)}
.card img,.card video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .g{opacity:0;transition:opacity .45s}
.card video{opacity:0;transition:opacity .3s}
.card.pv video{opacity:1}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 52%,rgba(0,0,0,.88) 100%);pointer-events:none}
.card .cap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:10px 11px 11px;display:flex;flex-direction:column;gap:2px}
.card .cap b{font-family:var(--display);font-size:clamp(15px,1.5vw,18px);line-height:1.25;text-wrap:balance}
.card .cap span{font-size:11.5px;color:#cfc4b9}
.card .vb{position:absolute;top:8px;left:8px;z-index:2;display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.62);border-radius:4px;padding:1px 7px 1px 5px;font-size:11px;font-weight:700;backdrop-filter:blur(4px)}
.card .vb svg{width:10px;height:10px}
.card .heart{position:absolute;top:6px;right:6px;z-index:2;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;opacity:0;transition:opacity .2s}
.card .heart.on{opacity:1;color:var(--lamp)}
@media (hover:hover){
  .card:hover{transform:scale(1.07);z-index:4;box-shadow:0 14px 40px rgba(0,0,0,.7),0 0 0 2px color-mix(in srgb,var(--sp) 70%,transparent)}
  .card:hover .g{opacity:1}
  .card:hover .heart{opacity:1}
}
@media (hover:none){
  .card .g{animation:flip 7s ease-in-out infinite;animation-delay:calc(var(--i,0)*.9s)}
}
@keyframes flip{0%,38%{opacity:0}50%,88%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.card .g{animation:none!important}.card{transition:none}.hero-media .poster{transition:none}}

/* ---------- browse grid (all / region / video / list / search) ---------- */
.page{padding-top:92px;min-height:80vh}
.page h1{margin:0 0 6px;font-family:var(--display);font-size:clamp(28px,4vw,42px);line-height:1.15}
.page .sub{margin:0 0 18px;color:var(--muted);max-width:60ch}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chips button{border:1px solid var(--line);border-radius:999px;padding:5px 15px;font-size:14px;font-weight:500;color:var(--muted);transition:border-color .2s,color .2s,background .2s}
.chips button:hover{color:var(--ink);border-color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);color:#15110e;border-color:var(--ink);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(132px,14vw,220px),1fr));gap:18px 12px;padding-bottom:48px}
.empty{padding:50px 0;color:var(--muted);text-align:center}

footer{border-top:1px solid var(--line);padding-block:28px 40px;color:var(--muted);font-size:13px;line-height:1.7}
footer b{color:var(--ink);font-family:var(--display);font-size:15px}
footer p{margin:6px 0 0;max-width:80ch}

/* ---------- detail sheet ---------- */
.modal{position:fixed;inset:0;z-index:60;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;background:rgba(0,0,0,.78);backdrop-filter:blur(4px);padding:max(28px,env(safe-area-inset-top,0px)) var(--gutr) 28px var(--gut);animation:fade .25s ease}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;width:min(1040px,100%);background:var(--card);border-radius:12px;box-shadow:0 30px 100px rgba(0,0,0,.8);overflow:clip;animation:rise .35s cubic-bezier(.2,.8,.2,1);--sp:var(--spirit)}
@keyframes rise{from{transform:translateY(24px) scale(.97);opacity:0}}
.sheet-x{position:absolute;top:12px;right:12px;z-index:8;width:38px;height:38px;border-radius:50%;background:rgba(20,17,15,.85);border:1px solid rgba(255,255,255,.2);display:grid;place-items:center}
.sheet-x:hover{background:#000}
.sheet-in{display:grid;grid-template-columns:minmax(260px,380px) minmax(0,1fr)}
.mcol{position:relative;background:#050403;padding:22px;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:flex-start}
.mcol::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 30%,color-mix(in srgb,var(--sp) 26%,transparent),transparent 70%);pointer-events:none}
.stick{position:sticky;top:22px;width:100%;display:flex;flex-direction:column;gap:12px;align-items:center}
.mstage{position:relative;width:100%;aspect-ratio:9/16;border-radius:10px;overflow:hidden;background:#000;box-shadow:0 0 0 1px rgba(255,255,255,.1);touch-action:pan-y}
.mstage video,.mstage .cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.cmp{position:absolute;inset:0}
.cmp .gst{clip-path:inset(0 calc(100% - var(--p,50%)) 0 0)}
.cmp .line{position:absolute;top:0;bottom:0;left:var(--p,50%);width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 12px rgba(0,0,0,.7)}
.cmp .knob{position:absolute;top:50%;left:var(--p,50%);width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:#fff;color:#15110e;display:grid;place-items:center;box-shadow:0 2px 14px rgba(0,0,0,.6)}
.cmp .lbl{position:absolute;top:10px;padding:2px 9px;border-radius:4px;font-size:12px;font-weight:700;background:rgba(0,0,0,.6)}
.cmp .lbl.a{left:10px;color:var(--sp)}.cmp .lbl.b{right:10px}
.cmp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.soon{position:absolute;left:10px;right:10px;bottom:10px;z-index:3;padding:7px 10px;border-radius:6px;background:rgba(0,0,0,.7);font-size:12.5px;text-align:center;color:#e5dacd;backdrop-filter:blur(4px)}
.vbar{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;align-items:center;gap:10px;padding:26px 12px 10px;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent)}
.vbar button{width:32px;height:32px;display:grid;place-items:center;border-radius:50%}
.vbar button:hover{background:rgba(255,255,255,.18)}
.vbar input[type=range]{flex:1;min-width:0;accent-color:var(--sp);height:4px}
.vtap{position:absolute;inset:0;z-index:2}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.08);position:relative;z-index:2}
.seg button{padding:5px 15px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#15110e}
.icol{padding:30px 32px 32px;display:flex;flex-direction:column;gap:18px;min-width:0}
.icol h2{margin:0;font-family:var(--display);font-size:clamp(30px,4vw,44px);line-height:1.1;padding-right:36px}
.icol .en{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--sp);font-weight:700;margin-bottom:6px}
.icol .lede{margin:0;font-size:17px;line-height:1.6;max-width:52ch}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mood{border-radius:10px;padding:13px 15px;background:var(--bg2);border:1px solid var(--line);font-size:14.5px;line-height:1.65}
.mood h3{margin:0 0 4px;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:7px;color:var(--muted)}
.mood.night{background:linear-gradient(160deg,#0f1218,var(--bg2));border-color:color-mix(in srgb,var(--sp) 35%,var(--line))}
.mood.night h3{color:var(--sp)}
.story{border:1px solid color-mix(in srgb,var(--sp) 30%,rgba(255,255,255,.08));border-radius:12px;padding:14px 16px;background:linear-gradient(135deg,color-mix(in srgb,var(--sp) 9%,#0b0d14),#0b0d14 70%)}
.story h3{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:8px}
.story .sub{margin:0 0 10px;font-size:13px;color:var(--muted)}
.story audio{width:100%;height:40px;color-scheme:dark}
.story .st-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.story .st-row button{font:inherit;font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:transparent;color:inherit;cursor:pointer}
.story .st-row button[aria-pressed="true"]{background:var(--sp);color:#000;border-color:var(--sp)}
.story details{margin-top:10px}.story summary{cursor:pointer;font-size:14px;color:var(--sp)}
.story .story-text{max-height:340px;overflow:auto;margin-top:8px;padding-right:6px;font-size:15px;line-height:1.85;color:#d8d8de}.story .story-text p{margin:0 0 12px}
.facts{display:grid;gap:14px}
.facts h3{margin:0 0 2px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.facts p{margin:0;max-width:62ch;font-size:15px}
.refs{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.refs a{color:var(--lamp);text-underline-offset:3px}
.more h3{margin:6px 0 10px;font-size:17px}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.mini .card{aspect-ratio:2/3}
.mini .card .cap{padding:6px 7px 7px}
.mini .card .cap b{font-size:13.5px}
.mini .card .cap span,.mini .vb{display:none}

@media (max-width:1100px){.hero-media .fan{display:none}}
@media (max-width:860px){
  .hero{height:auto;min-height:0}
  .hero .inner{grid-template-columns:1fr;gap:0;padding-top:64px;padding-bottom:56px;align-items:start}
  .hero-media{order:-1;height:auto;width:min(58vw,300px);max-height:none;margin:0 auto 18px}
  .hero-copy{max-width:none;align-self:auto}
  .hero::before{background:radial-gradient(80% 36% at 50% 24%,color-mix(in srgb,var(--spirit) 22%,transparent),transparent 72%),linear-gradient(180deg,rgba(0,0,0,.3) 0,transparent 30%,var(--bg) 100%)}
  .hero h1{font-size:clamp(38px,11vw,56px)}
  .dots{bottom:6px}.dots .inner{justify-content:center}.hero-media .fan{display:none}
  main{margin-top:-8px}
  .logo{font-size:18px}
  .nav .inner{gap:10px}
  .sheet-in{grid-template-columns:1fr}
  .mcol{padding:58px 16px 14px}.stick{position:static}
  .mstage{width:min(100%,calc(62vh*9/16))}

/* hero */
let heroObs=null;
function setSnd(){const b=$('#snd');if(!b)return;b.classList.toggle('off',heroMuted);b.innerHTML=(heroMuted?ICON.mute:ICON.vol)+'<span>แตะเพื่อเปิดเสียง</span>';b.setAttribute('aria-label',heroMuted?'เปิดเสียง':'ปิดเสียง')}
function heroUnmute(){const v=$('#heroVid');if(!v||!$('#snd')||!$('#modal').hidden)return;heroMuted=false;v.muted=false;setSnd();v.play().catch(e=>{if(e&&e.name==='NotAllowedError'){heroMuted=true;v.muted=true;setSnd();v.play().catch(()=>{})}})}
['pointerdown','keydown','touchend'].forEach(ev=>addEventListener(ev,e=>{if(heroUserSet||!heroMuted)return;if(e.target.closest&&(e.target.closest('#snd')||e.target.closest('[data-open]')||e.target.closest('.card')))return;heroUnmute()},{capture:true,passive:true}));
function stopHeroObs(){if(heroObs){heroObs.disconnect();heroObs=null}}
function setupHero(){
  const v=$('#heroVid');if(!v)return;
  const hasSnd=!!$('#snd');
  if(!heroUserSet&&hasSnd&&navigator.userActivation&&navigator.userActivation.hasBeenActive)heroMuted=false;
  v.muted=heroMuted||!hasSnd;setSnd();
  const poster=$('.hero-media .poster');
  v.addEventListener('playing',()=>poster&&poster.classList.add('hide'),{once:true});
  const p=v.play();if(p&&p.catch)p.catch(()=>{heroMuted=true;v.muted=true;setSnd();v.play().catch(()=>{})});
  heroObs=new IntersectionObserver(es=>{es.forEach(e=>{if(!document.getElementById('heroVid'))return;if(e.isIntersecting&&$('#modal').hidden)v.play().catch(()=>{});else v.pause()})},{threshold:.15});
  heroObs.observe($('.hero'));
}
function setupRails(){
  document.querySelectorAll('.rail').forEach(r=>{
    const t=$('.track',r),l=$('.arr.l',r),rr=$('.arr.r',r);
    const upd=()=>{l.disabled=t.scrollLeft<8;rr.disabled=t.scrollLeft+t.clientWidth>=t.scrollWidth-8};
    t.addEventListener('scroll',upd,{passive:true});upd();setTimeout(upd,400);
    l.onclick=()=>t.scrollBy({left:-t.clientWidth*.85,behavior:'smooth'});
    rr.onclick=()=>t.scrollBy({left:t.clientWidth*.85,behavior:'smooth'});
  });
}

function setStory(g){
  const a=$('#storyAudio'),d=$('#storyDet');if(!a)return;clearTimeout(sleepT);

    if(m)sleepT=setTimeout(()=>{let vol=a.volume;const f=setInterval(()=>{vol-=.05;if(vol<=0){clearInterval(f);a.pause();a.volume=1}else a.volume=vol},300)},m*60000);

function closeSheet(){

function setSheetView(v,autoplay){
  cancelAnimationFrame(sweepRaf);
  sheetView=v;const g=cur;const st=$('#mstage');
  document.querySelectorAll('[data-sv]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.sv===v)));
  if(v==='vid'){
    st.innerHTML=`<video id="mv" src="vid/${g.video}.mp4" poster="vid/${g.video}.jpg" loop playsinline preload="auto" ${autoplay?'':'muted'}></video>

    const vid=$('#mv'),pp=$('#vpp'),seek=$('#vseek'),mu=$('#vmute');

    vid.addEventListener('play',sync);vid.addEventListener('pause',sync);
    vid.addEventListener('timeupdate',()=>{if(vid.duration&&!seek.dataset.drag)seek.value=Math.round(vid.currentTime/vid.duration*1000)});
    seek.addEventListener('input',()=>{seek.dataset.drag='1';if(vid.duration)vid.currentTime=seek.value/1000*vid.duration});
    seek.addEventListener('change',()=>{delete seek.dataset.drag});

    pp.onclick=tog;$('#vtap').onclick=tog;
    mu.onclick=()=>{vid.muted=!vid.muted;sync()};
    vid.play().catch(()=>{vid.muted=true;vid.play().catch(()=>{});sync()});sync();
  }else{
    st.innerHTML=`<div class="cmp" id="cmp" style="--p:0%">
      <img src="img/${g.n}_h.jpg" alt="ภาพ${g.name} ตอนเป็นคน">

      <div class="line"></div><div class="knob">${ICON.swap}</div>
      <input type="range" min="0" max="100" value="0" id="cmpR" aria-label="เลื่อนเพื่อเปลี่ยนจากคนเป็นผี">
    </div>${g.video?'':'<div class="soon">วิดีโอของตัวนี้กำลังทำ ระหว่างนี้ลากดูภาพตอนเป็นคนและตอนเป็นผีได้</div>'}`;
    const c=$('#cmp'),r=$('#cmpR');let user=false;
    const set=p=>c.style.setProperty('--p',p+'%');
    r.addEventListener('input',()=>{user=true;cancelAnimationFrame(sweepRaf);set(r.value)});
    if(matchMedia('(prefers-reduced-motion:reduce)').matches){set(50);r.value=50;return}
    const t0=performance.now();
    const step=t=>{if(user)return;const k=Math.min(1,(t-t0-500)/3200);if(k>=0){const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;set((e*100).toFixed(1));r.value=e*100}if(k<1)sweepRaf=requestAnimationFrame(step)};
    sweepRaf=requestAnimationFrame(step);
